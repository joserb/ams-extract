[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ams-extract"
version = "0.1.0"
description = "CLI to extract data from RBMware / AMS Machinery Manager .rbm databases to Parquet + JSON"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Jose RB" }]
keywords = ["rbmware", "ams", "vibration", "parquet", "etl"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "structlog>=24.1",
    "matplotlib>=3.9",
    "vibframe-viewer",
]

[project.optional-dependencies]
# Extractor de ground truth desde informes PDF (`rbm informes`, workplan 09).
# Extra y no dependencia dura: quien sólo lee .rbm no necesita un parser de
# PDF, y el import vive dentro del comando que lo usa.
informes = ["pdfplumber>=0.11"]

[project.scripts]
rbm = "ams_extract.cli:app"
rbm-dev = "ams_extract.cli_dev:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "vibsynth-contracts",
]

[tool.uv.sources]
# Los repos del ecosistema se resuelven por checkout vecino con paths
# editables. Este repo vive en el lado Windows (junto a la VM y las bases
# .rbm), así que "vecino" solo se cumple para los que están bajo
# /mnt/c/Users/joser/work/ (vibsynth). `vibframe-viewer` vive en el lado WSL
# (~/wslprojects/, fuera ya de RESONINS desde 2026-07-31): desde
# aquí la ruta relativa cruzaría siete niveles hasta la raíz, así que se usa
# la absoluta (mismo criterio que t8-extract, que apunta con ruta absoluta a
# los repos del lado Windows).
vibframe-viewer = { path = "/home/joserb/wslprojects/vibframe-viewer", editable = true }
vibsynth-contracts = { path = "../../vibsynth/vibsynth-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ams_extract"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require RBM_TEST_FILE pointing to a real .rbm fixture",
]
